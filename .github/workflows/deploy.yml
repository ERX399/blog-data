name: Generate Build Artifacts

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'img/**'
      - 'generate-posts.js'
      - 'convert-to-webp.js'
      - 'package.json'
      - 'package-lock.json'
      - '_headers'
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: node convert-to-webp.js

      - run: node generate-posts.js

      # 生成产物（posts.json / posts-*.json / rss.xml）写回仓库，本地无需再手跑脚本。
      # 用 GITHUB_TOKEN 提交，GitHub 不会因此递归触发本 workflow；[skip ci] 再兜底一层。
      - name: 生成产物回写仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json posts-*.json rss.xml
          git diff --staged --quiet || (
            git commit -m "🤖 自动生成数据 [skip ci]"
            git push
          )

      - name: Prepare dist directory
        run: |
          cp -r img/* dist/img/
          cp _headers dist/

      # 部署不在此处：raw-posts.520pro.top 与 520pro.top 均挂 Cloudflare Pages，
      # 都直连 git 在 push 到 main 后自动构建，无需 wrangler deploy，也无需跨仓库 dispatch。
